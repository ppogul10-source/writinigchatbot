<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>읽걷쓰 글쓰기 파트너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap">

<style>
:root {
  --bg: #f5f3ef; --bg-panel: #ffffff; --bg-right: #eef2fb;
  --fg: #2a2724; --fg-muted: #7a746e;
  --accent: #3b6fd4; --accent-warm: #e06a35;
  --clr-o: #d97706; --clr-r: #2563eb; --clr-e: #059669;
  --border: #e0dbd4; --shadow-sm: 0 1px 3px rgba(0,0,0,0.07);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #18161a; --bg-panel: #221f24; --bg-right: #1a1e2e;
    --fg: #ede8e2; --fg-muted: #938e88;
    --accent: #6b96f5; --accent-warm: #f08050;
    --clr-o: #fbbf24; --clr-r: #60a5fa; --clr-e: #34d399;
    --border: #38343c; --shadow-sm: 0 1px 3px rgba(0,0,0,0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #18161a; --bg-panel: #221f24; --bg-right: #1a1e2e;
  --fg: #ede8e2; --fg-muted: #938e88;
  --accent: #6b96f5; --accent-warm: #f08050;
  --clr-o: #fbbf24; --clr-r: #60a5fa; --clr-e: #34d399;
  --border: #38343c; --shadow-sm: 0 1px 3px rgba(0,0,0,0.25);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg); color: var(--fg);
  font-family: 'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-size: 14px; line-height: 1.6;
}

.app { display: flex; flex-direction: column; height: 100%; overflow: hidden; }

.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 18px; background: var(--bg-panel);
  border-bottom: 1px solid var(--border); flex-shrink: 0; min-height: 48px;
}
.logo { font-size: 20px; font-weight: 800; letter-spacing: -.5px; color: var(--accent); flex-shrink: 0; }
.logo em { color: var(--accent-warm); font-style: normal; }
.topbar-sub { font-size: 11.5px; color: var(--fg-muted); flex: 1; }
.steps { display: flex; gap: 5px; flex-shrink: 0; }
.step-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); transition: background .25s; }
.step-dot.active { background: var(--accent); }
.step-dot.done   { background: var(--clr-e); }

.intro-wrap {
  flex: 1; display: flex; align-items: flex-start; justify-content: center;
  overflow-y: auto; padding: 24px 16px;
}
.intro-card {
  background: var(--bg-panel); border-radius: 16px; padding: 28px;
  max-width: 520px; width: 100%; box-shadow: 0 4px 24px rgba(0,0,0,.08);
  display: flex; flex-direction: column; gap: 18px; align-items: center; text-align: center;
}
.intro-emoji { font-size: 48px; }
.intro-card h2 { font-size: 20px; font-weight: 800; letter-spacing: -.4px; text-wrap: balance; }
.intro-card p { font-size: 13px; color: var(--fg-muted); line-height: 1.75; }

.type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.type-card {
  border: 2px solid var(--border); border-radius: 12px; padding: 14px 12px;
  cursor: pointer; text-align: left; background: var(--bg); color: var(--fg); font-family: inherit;
  transition: border-color .15s, background .15s, transform .1s;
  display: flex; flex-direction: column; gap: 6px;
}
.type-card:hover { border-color: var(--accent); background: var(--bg-panel); }
.type-card.selected { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--bg-panel)); }
.type-card:active { transform: scale(.97); }
.type-icon { font-size: 26px; }
.type-name { font-size: 13.5px; font-weight: 800; }
.type-desc { font-size: 11px; color: var(--fg-muted); line-height: 1.4; }

.topic-section { width: 100%; display: flex; flex-direction: column; gap: 10px; text-align: left; }
.section-label { font-size: 12px; font-weight: 700; color: var(--fg-muted); letter-spacing: .04em; }
.topic-examples { display: flex; flex-wrap: wrap; gap: 6px; }
.topic-chip {
  padding: 5px 11px; border-radius: 20px; border: 1.5px solid var(--border);
  font-size: 12px; font-weight: 600; cursor: pointer; background: var(--bg);
  color: var(--fg-muted); font-family: inherit; transition: all .15s; text-align: left;
}
.topic-chip:hover { border-color: var(--accent); color: var(--accent); background: var(--bg-panel); }
.topic-chip.selected { border-color: var(--accent); background: var(--accent); color: #fff; }
.topic-input {
  width: 100%; padding: 11px 14px; border-radius: 10px;
  border: 2px solid var(--border); background: var(--bg); color: var(--fg);
  font-size: 14px; font-family: inherit; outline: none; transition: border-color .15s;
}
.topic-input:focus { border-color: var(--accent); }

.start-btn {
  width: 100%; padding: 12px; background: var(--accent); color: #fff;
  border: none; border-radius: 10px; font-size: 15px; font-weight: 700;
  cursor: pointer; font-family: inherit; transition: opacity .15s, transform .1s;
}
.start-btn:hover:not(:disabled) { opacity: .88; }
.start-btn:active:not(:disabled) { transform: scale(.98); }
.start-btn:disabled { opacity: .42; cursor: default; }

.split { display: flex; flex: 1; min-height: 0; overflow: hidden; }

.panel-left {
  flex: 1; min-width: 0; background: var(--bg-panel);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
.panel-hd {
  padding: 11px 18px 9px; border-bottom: 1px solid var(--border);
  flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.panel-title { font-size: 12px; font-weight: 700; color: var(--fg-muted); text-transform: uppercase; letter-spacing: .07em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.view-tabs { display: flex; }
.view-tab { padding: 5px 11px; font-size: 11.5px; font-weight: 700; color: var(--fg-muted); cursor: pointer; border-bottom: 2px solid transparent; transition: color .15s, border-color .15s; white-space: nowrap; }
.view-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.panel-body { flex: 1; overflow-y: auto; padding: 14px 18px; scroll-behavior: smooth; }

.writing-type-badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px; border-radius: 20px; font-size: 11.5px; font-weight: 700;
  background: color-mix(in srgb, var(--accent) 12%, var(--bg));
  color: var(--accent); margin-bottom: 12px;
}

.topic-banner {
  background: #fffbeb; border-left: 3px solid var(--clr-o);
  padding: 7px 12px; border-radius: 0 8px 8px 0;
  font-size: 12.5px; color: #92400e; margin-bottom: 14px; font-weight: 600;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .topic-banner { background: #2c1d00; color: #fbbf24; }
}
:root[data-theme="dark"] .topic-banner { background: #2c1d00; color: #fbbf24; }

.oreo-card {
  margin-bottom: 14px; border: 1.5px solid var(--border);
  border-radius: 10px; overflow: hidden; transition: border-color .2s, box-shadow .2s;
}
.oreo-card.focused {
  border-color: var(--accent);
  box-shadow: 0 0 0 2.5px color-mix(in srgb, var(--accent) 22%, transparent);
}
.card-hd {
  display: flex; align-items: center; gap: 9px; padding: 9px 13px;
  background: var(--bg); border-bottom: 1px solid var(--border);
}
.oreo-badge {
  width: 28px; height: 28px; border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 800; flex-shrink: 0;
}
.b-O { background: #fef3c7; color: #b45309; }
.b-R { background: #dbeafe; color: #1e40af; }
.b-E { background: #d1fae5; color: #065f46; }
.b-P { background: #fae8ff; color: #7e22ce; }
.b-G { background: #ecfdf5; color: #065f46; }
.b-Y { background: #fefce8; color: #854d0e; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .b-O { background: #3d2700; color: #fbbf24; }
  :root:not([data-theme="light"]) .b-R { background: #162040; color: #60a5fa; }
  :root:not([data-theme="light"]) .b-E { background: #053322; color: #34d399; }
  :root:not([data-theme="light"]) .b-P { background: #2e1a40; color: #d8b4fe; }
  :root:not([data-theme="light"]) .b-G { background: #053322; color: #6ee7b7; }
  :root:not([data-theme="light"]) .b-Y { background: #3d2e00; color: #fde68a; }
}
:root[data-theme="dark"] .b-O { background: #3d2700; color: #fbbf24; }
:root[data-theme="dark"] .b-R { background: #162040; color: #60a5fa; }
:root[data-theme="dark"] .b-E { background: #053322; color: #34d399; }
:root[data-theme="dark"] .b-P { background: #2e1a40; color: #d8b4fe; }
:root[data-theme="dark"] .b-G { background: #053322; color: #6ee7b7; }
:root[data-theme="dark"] .b-Y { background: #3d2e00; color: #fde68a; }

.card-label { font-size: 13px; font-weight: 700; min-width: 0; }
.card-sublabel { font-size: 11px; color: var(--fg-muted); margin-left: auto; white-space: nowrap; }
.oreo-card textarea {
  width: 100%; min-height: 84px; padding: 10px 13px;
  background: transparent; border: none; outline: none; resize: vertical;
  font-family: inherit; font-size: 13.5px; color: var(--fg); line-height: 1.75;
}
.oreo-card textarea::placeholder { color: var(--fg-muted); opacity: .65; }
.card-ft {
  display: flex; align-items: center; padding: 6px 12px; gap: 8px;
  border-top: 1px solid var(--border); background: var(--bg);
}
.ask-btn {
  display: flex; align-items: center; gap: 4px;
  padding: 5px 11px; background: var(--accent); color: #fff;
  border: none; border-radius: 6px; font-size: 12px; font-weight: 700;
  cursor: pointer; font-family: inherit; transition: opacity .15s;
}
.ask-btn:hover:not(:disabled) { opacity: .85; }
.ask-btn:disabled { opacity: .45; cursor: default; }
.char-count { font-size: 11px; color: var(--fg-muted); margin-left: auto; font-variant-numeric: tabular-nums; }

.essay-preview {
  border: 1.5px dashed var(--border); border-radius: 10px; padding: 16px;
  background: var(--bg); font-size: 14px; line-height: 1.9;
  white-space: pre-wrap; color: var(--fg); min-height: 220px;
}

.panel-right {
  width: 42%; min-width: 280px; max-width: 480px;
  background: var(--bg-right); display: flex; flex-direction: column; overflow: hidden;
}
.ai-hd {
  display: flex; align-items: center; gap: 10px; padding: 10px 16px;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.ai-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent-warm));
  display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0;
}
.ai-name { font-size: 13.5px; font-weight: 700; }
.ai-status { font-size: 11px; color: var(--fg-muted); }
.section-ctx {
  padding: 7px 16px; border-bottom: 1px solid var(--border);
  font-size: 11.5px; color: var(--fg-muted); flex-shrink: 0; background: var(--bg-panel);
}
.section-ctx strong { color: var(--fg); }
.ai-msgs { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 90%; padding: 10px 13px; border-radius: 12px; font-size: 13px; line-height: 1.65; }
.msg-ai { background: var(--bg-panel); align-self: flex-start; border-bottom-left-radius: 3px; box-shadow: var(--shadow-sm); }
.msg-user { background: var(--accent); color: #fff; align-self: flex-end; border-bottom-right-radius: 3px; }
.typing {
  display: flex; align-items: center; gap: 4px; padding: 10px 13px;
  background: var(--bg-panel); border-radius: 12px; border-bottom-left-radius: 3px;
  align-self: flex-start; box-shadow: var(--shadow-sm);
}
.tdot { width: 7px; height: 7px; border-radius: 50%; background: var(--fg-muted); animation: tdot 1.2s infinite; }
.tdot:nth-child(2) { animation-delay: .2s; }
.tdot:nth-child(3) { animation-delay: .4s; }
@keyframes tdot { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }

.quick-qs {
  display: flex; gap: 6px; padding: 8px 14px 4px;
  overflow-x: auto; flex-shrink: 0;
  border-top: 1px solid var(--border);
  scrollbar-width: none;
}
.quick-qs::-webkit-scrollbar { display: none; }
.q-chip {
  padding: 5px 11px; border-radius: 20px; white-space: nowrap;
  border: 1.5px solid var(--border); font-size: 12px; font-weight: 600;
  cursor: pointer; background: var(--bg-panel); color: var(--fg-muted);
  font-family: inherit; transition: all .15s; flex-shrink: 0;
}
.q-chip:hover { border-color: var(--accent); color: var(--accent); background: var(--bg-right); }

.ai-input-area {
  display: flex; gap: 8px; padding: 10px 14px;
  border-top: 1px solid var(--border); flex-shrink: 0;
}
.ai-input {
  flex: 1; min-width: 0; padding: 9px 12px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--bg-panel); color: var(--fg);
  font-size: 13px; font-family: inherit; outline: none; transition: border-color .15s;
}
.ai-input:focus { border-color: var(--accent); }
.send-btn {
  padding: 9px 14px; background: var(--accent); color: #fff;
  border: none; border-radius: 8px; font-size: 13px; font-weight: 700;
  cursor: pointer; font-family: inherit; transition: opacity .15s; white-space: nowrap;
}
.send-btn:hover:not(:disabled) { opacity: .85; }
.send-btn:disabled { opacity: .45; cursor: default; }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

@media (max-width: 640px) {
  html, body { overflow: auto; height: auto; }
  .app { height: auto; overflow: visible; }
  .split { flex-direction: column; overflow: visible; }
  .panel-left { min-height: 400px; border-right: none; border-bottom: 1px solid var(--border); }
  .panel-right { width: 100%; min-width: 0; max-width: none; min-height: 360px; }
  .topbar-sub { display: none; }
}
@media (prefers-reduced-motion: reduce) { .tdot { animation: none; } }
</style>
</head>
<body>

<div class="app" id="app">
  <header class="topbar">
    <div class="logo">읽<em>걷</em>쓰</div>
    <div class="topbar-sub">글토리와 함께하는 1:1 글쓰기</div>
    <div class="steps" id="steps"></div>
  </header>

  <div class="intro-wrap" id="introWrap">
    <div class="intro-card">
      <div class="intro-emoji">✏️</div>
      <h2>오늘 어떤 글을 써볼까요?</h2>
      <p>글의 종류를 먼저 고른 다음, 주제를 정해봐요.<br>글토리가 정답 대신 질문으로 도와줄 거예요!</p>
      <div style="width:100%;text-align:left">
        <div class="section-label" style="margin-bottom:8px">글의 종류 선택</div>
        <div class="type-grid" id="typeGrid"></div>
      </div>
      <div class="topic-section" id="topicSection" style="display:none">
        <div class="section-label">주제 예시 (클릭하거나 직접 입력)</div>
        <div class="topic-examples" id="topicExamples"></div>
        <input type="text" id="topicInput" class="topic-input"
          placeholder="주제를 직접 입력하거나 위에서 골라보세요" maxlength="80">
      </div>
      <button class="start-btn" id="startBtn" disabled>시작하기 →</button>
    </div>
  </div>

  <div class="split" id="mainSplit" style="display:none">
    <div class="panel-left">
      <div class="panel-hd">
        <div class="panel-title" id="panelTitle">✍️ 내 글쓰기</div>
        <div class="view-tabs">
          <div class="view-tab active" data-v="write" onclick="switchView('write')">📝 작성</div>
          <div class="view-tab" data-v="preview" onclick="switchView('preview')">📄 완성글</div>
        </div>
      </div>
      <div id="writeMode" class="panel-body">
        <div id="typeBadge" class="writing-type-badge"></div>
        <div class="topic-banner" id="topicBanner"></div>
        <div id="sectionsContainer"></div>
      </div>
      <div id="previewMode" class="panel-body" style="display:none">
        <div class="essay-preview" id="essayPreview"></div>
      </div>
    </div>

    <div class="panel-right">
      <div class="ai-hd">
        <div class="ai-avatar">🤖</div>
        <div>
          <div class="ai-name">글토리</div>
          <div class="ai-status" id="aiStatus">질문하면 도와줄게!</div>
        </div>
      </div>
      <div class="section-ctx" id="sectionCtx">현재: <strong>시작 전</strong></div>
      <div class="ai-msgs" id="aiMsgs"></div>
      <div class="quick-qs" id="quickQs"></div>
      <div class="ai-input-area">
        <input type="text" id="userInput" class="ai-input"
          placeholder="글토리에게 질문해봐요..." maxlength="200">
        <button class="send-btn" id="sendBtn" onclick="sendMsg()">전송</button>
      </div>
    </div>
  </div>
</div>

<script>
const TYPES = {
  argumentative: {
    name: '주장하는 글', icon: '💬', desc: 'OREO 공식으로 논리적으로', structure: 'OREO 공식',
    topics: ['스마트폰 사용 시간을 줄여야 할까?','동물원이 필요할까?','숙제는 없애야 할까?','학교 급식은 꼭 먹어야 할까?','반려동물을 키워야 할까?','방과 후 학원을 다녀야 할까?'],
    sections: [
      { id:'s0', badge:'O', bc:'b-O', label:'주장 (Opinion)', sub:'내 의견을 한 문장으로', ph:'예) 나는 스마트폰 사용 시간을 하루 1시간으로 줄여야 한다고 생각한다.\n왜냐하면 눈 건강과 수면에 나쁜 영향을 주기 때문이다.', max:300 },
      { id:'s1', badge:'R', bc:'b-R', label:'이유 1 (Reason)', sub:'첫 번째 근거', ph:'예) 첫 번째 이유는 스마트폰을 오래 보면 눈이 나빠지기 때문이다.\n요즘 어린이 근시 환자가 계속 늘고 있다는 뉴스도 있다.', max:400 },
      { id:'s2', badge:'R', bc:'b-R', label:'이유 2 (Reason)', sub:'두 번째 근거', ph:'예) 두 번째 이유는 잠자기 전 스마트폰을 보면 잠이 잘 오지 않기 때문이다.\n다음 날 학교에서 집중하기 어렵고 피곤해진다.', max:400 },
      { id:'s3', badge:'E', bc:'b-E', label:'예시 (Example)', sub:'구체적인 사례', ph:'예) 나는 지난 주말에 유튜브를 3시간 본 후 눈이 뻑뻑하고 두통이 생겼다.\n또는 뉴스에서 본 것, 친구나 가족의 사례도 좋아요.', max:500 },
      { id:'s4', badge:'O', bc:'b-O', label:'마무리 (Opinion)', sub:'처음 주장을 더 힘있게', ph:'예) 따라서 나는 스마트폰 사용 시간을 꼭 줄여야 한다고 생각한다.\n가족끼리 규칙을 정하거나, 사용 앱을 제한해보는 건 어떨까?', max:300 },

const TYPE_KEYS = ['argumentative','essay','poem','theme'];

let sample = null, selectedType = null, topic = '', currentFocus = 's0', busy = false;

function buildTypeGrid() {
  const grid = document.getElementById('typeGrid');
  TYPE_KEYS.forEach(key => {
    const t = TYPES[key];
    const card = document.createElement('button');
    card.className = 'type-card';
    card.dataset.key = key;
    card.innerHTML = `<div class="type-icon">${t.icon}</div><div class="type-name">${t.name}</div><div class="type-desc">${t.desc}</div>`;
    card.addEventListener('click', () => selectType(key));
    grid.appendChild(card);
  });
}

function selectType(key) {
  selectedType = key;
  document.querySelectorAll('.type-card').forEach(c => c.classList.toggle('selected', c.dataset.key === key));
  showTopicArea(key);
  updateStartBtn();
}

function showTopicArea(key) {
  const t = TYPES[key];
  document.getElementById('topicSection').style.display = '';
  const examples = document.getElementById('topicExamples');
  examples.innerHTML = '';
  t.topics.forEach(tp => {
    const chip = document.createElement('button');
    chip.className = 'topic-chip';
    chip.textContent = tp;
    chip.addEventListener('click', () => {
      document.querySelectorAll('.topic-chip').forEach(c => c.classList.remove('selected'));
      chip.classList.add('selected');
      document.getElementById('topicInput').value = tp;
      updateStartBtn();
    });
    examples.appendChild(chip);
  });
  document.getElementById('topicInput').value = '';
}

function updateStartBtn() {
  const val = document.getElementById('topicInput').value.trim();
  document.getElementById('startBtn').disabled = !selectedType || !val || !sample;
}

function startApp() {
  topic = document.getElementById('topicInput').value.trim();
  if (!topic || !selectedType || !sample) return;
  document.getElementById('introWrap').style.display = 'none';
  document.getElementById('mainSplit').style.display = 'flex';
  const t = TYPES[selectedType];
  const short = topic.length > 22 ? topic.slice(0,22)+'…' : topic;
  document.getElementById('panelTitle').textContent = '✍️ ' + short;
  document.getElementById('topicBanner').textContent = '📌 주제: ' + topic;
  document.getElementById('typeBadge').textContent = t.icon + ' ' + t.name + ' · ' + t.structure;
  buildSections();
  setFocus('s0');
  addAIMsg(`${t.icon} **"${topic}"** — 시작해봐!\n첫 번째 칸 쓰고 **[질문 받기]** 눌러봐.`);
}

function buildSections() {
  const container = document.getElementById('sectionsContainer');
  container.innerHTML = '';
  const stepsEl = document.getElementById('steps');
  stepsEl.innerHTML = '';
  TYPES[selectedType].sections.forEach((sec, i) => {
    const d = document.createElement('div');
    d.className = 'step-dot'; d.id = 'dot' + i;
    stepsEl.appendChild(d);
    const card = document.createElement('div');
    card.className = 'oreo-card'; card.id = 'card-' + sec.id;
    card.innerHTML = `
      <div class="card-hd">
        <span class="oreo-badge ${sec.bc}">${sec.badge}</span>
        <span class="card-label">${sec.label}</span>
        <span class="card-sublabel">${sec.sub}</span>
      </div>
      <textarea id="ta-${sec.id}" placeholder="${sec.ph}" maxlength="${sec.max}"
        oninput="onType('${sec.id}')" onfocus="setFocus('${sec.id}')"></textarea>
      <div class="card-ft">
        <button class="ask-btn" id="askbtn-${sec.id}" onclick="askAI('${sec.id}')">🤔 질문 받기</button>
        <span class="char-count" id="cc-${sec.id}">0 / ${sec.max}</span>
      </div>`;
    container.appendChild(card);
  });
}

function setFocus(id) {
  currentFocus = id;
  document.querySelectorAll('.oreo-card').forEach(c => c.classList.remove('focused'));
  document.getElementById('card-' + id)?.classList.add('focused');
  const sec = TYPES[selectedType]?.sections.find(s => s.id === id);
  document.getElementById('sectionCtx').innerHTML = `현재 작성 중: <strong>${sec?.label || ''}</strong>`;
}

function onType(id) {
  const ta = document.getElementById('ta-' + id);
  const sec = TYPES[selectedType].sections.find(s => s.id === id);
  document.getElementById('cc-' + id).textContent = ta.value.length + ' / ' + sec.max;
  updateDots();
}

function updateDots() {
  TYPES[selectedType]?.sections.forEach((sec, i) => {
    const v = (document.getElementById('ta-' + sec.id)?.value || '').trim().length;
    const dot = document.getElementById('dot' + i);
    if (dot) dot.className = 'step-dot' + (v > 8 ? ' done' : sec.id === currentFocus ? ' active' : '');
  });
}

function switchView(v) {
  document.querySelectorAll('.view-tab').forEach(t => t.classList.toggle('active', t.dataset.v === v));
  document.getElementById('writeMode').style.display = v === 'write' ? '' : 'none';
  document.getElementById('previewMode').style.display = v === 'preview' ? '' : 'none';
  if (v === 'preview') buildPreview();
}

function buildPreview() {
  const parts = (TYPES[selectedType]?.sections || [])
    .map(sec => (document.getElementById('ta-' + sec.id)?.value || '').trim()).filter(Boolean);
  document.getElementById('essayPreview').textContent =
    parts.length ? parts.join('\n\n') : '아직 작성된 내용이 없어요. 각 칸에 글을 써보세요!';
}

function buildContext() {
  return TYPES[selectedType].sections.map(sec => {
    const v = (document.getElementById('ta-' + sec.id)?.value || '').trim();
    return `${sec.label}: ${v || '미작성'}`;
  }).join('\n');
}

// 글토리의 공통 규칙과 '좋은 질문' 만드는 법
function tutorRules(t) {
  return (
    `너는 초등학생 글쓰기 도우미 '글토리'야. ${t.aiGuide}\n\n` +
    `[절대 규칙]\n` +
    `- 학생 대신 문장을 써 주거나 고쳐 주지 않는다. 학생 글에 그대로 옮겨 쓸 수 있는 예시 문장도 주지 않는다.\n` +
    `- 2~3문장, 질문은 1~2개만. 초등학생이 바로 알아듣는 쉬운 말과 다정한 반말로 말한다.\n` +
    `- 과한 칭찬은 하지 않는다. 이모지는 1개 이하.\n\n` +
    `[좋은 질문 만드는 법]\n` +
    `1. 학생이 쓴 표현을 작은따옴표로 그대로 짚고, 바로 그 부분을 묻는다.\n` +
    `2. "더 자세히 써 봐"처럼 막연하게 말하지 않는다. 무엇을 떠올리면 되는지 구체적으로 묻는다: 언제, 어디서, 누구와, 무엇이 보이고 들렸는지, 그때 기분, 왜 그랬는지.\n` +
    `3. 지금 칸이 맡은 역할에 맞는 질문을 한다.\n` +
    `4. 앞 칸과 내용이 이어지지 않거나 서로 겹치면 그 점을 묻는다.\n` +
    `5. 칸이 비어 있으면, 생각의 실마리가 되는 쉬운 질문 하나만 한다.\n\n` +
    `[좋은 질문 예시]\n${t.qExamples.map(q => '- ' + q).join('\n')}\n\n` +
    `[나쁜 질문 예시: 이렇게 하지 마]\n` +
    `- "더 자세히 써 보세요." → 무엇을 자세히 쓰라는지 모름\n` +
    `- "정말 좋은 글이에요! 계속 써 봐요." → 생각을 끌어내지 못함\n` +
    `- "'~라고 써 보는 건 어때?'" → 대신 써 준 것\n\n` +
    `글 종류: ${t.name} / 주제: "${topic}"\n` +
    `학생이 지금까지 쓴 글 전체:\n${buildContext()}\n`
  );
}

async function askAI(sectionId) {
  if (busy || !sample) return;
  setFocus(sectionId);
  const sec = TYPES[selectedType].sections.find(s => s.id === sectionId);
  const content = (document.getElementById('ta-' + sectionId)?.value || '').trim();
  const t = TYPES[selectedType];
  const prompt =
    tutorRules(t) +
    `\n지금 칸: [${sec.label}] (이 칸의 역할: ${sec.sub})\n` +
    `이 칸에 쓴 글: "${content || '아직 비어 있음'}"\n\n` +
    `→ 위 규칙에 따라, 이 칸의 글을 짚는 구체적인 질문 1~2개로 답해.`;
  await callAI(prompt);
}

async function sendMsg() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text || busy || !sample) return;
  input.value = '';
  addUserMsg(text);
  const t = TYPES[selectedType];
  const sec = t.sections.find(s => s.id === currentFocus);
  const prompt =
    tutorRules(t) +
    `\n학생이 지금 보고 있는 칸: [${sec?.label || ''}]\n` +
    `학생이 글토리에게 한 말: "${text}"\n\n` +
    `→ 학생의 말에 먼저 짧게 답해. 쓰는 방법을 물으면 방법만 한 문장으로 알려 주고(학생 글에 쓸 문장은 주지 마), ` +
    `"예시 들어줘"라고 하면 학생 주제와 전혀 다른 소재로 아주 짧게만 보여 줘. 그다음 학생의 글을 짚는 구체적인 질문 1개로 끝내.`;
  await callAI(prompt);
}

async function callAI(prompt) {
  setBusy(true); showTyping();
  let text = '';
  try {
    const res = await sample(prompt);
    text = res.text || '음... 다시 한 번 물어봐 줄래?';
  } catch (err) {
    if (err.code === 'rate_limited') text = '잠깐! 잠시 후 다시 눌러봐.';
    else text = '잠깐 오류가 났어요. 다시 시도해봐요.';
  }
  hideTyping(); addAIMsg(text); setBusy(false);
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function addAIMsg(text) {
  const c = document.getElementById('aiMsgs');
  const d = document.createElement('div');
  d.className = 'msg msg-ai';
  d.innerHTML = escapeHtml(text).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
  c.appendChild(d); c.scrollTop = c.scrollHeight;
}
function addUserMsg(text) {
  const c = document.getElementById('aiMsgs');
  const d = document.createElement('div');
  d.className = 'msg msg-user'; d.textContent = text;
  c.appendChild(d); c.scrollTop = c.scrollHeight;
}
function showTyping() {
  const c = document.getElementById('aiMsgs');
  const d = document.createElement('div');
  d.className = 'typing'; d.id = 'typingEl';
  d.innerHTML = '<div class="tdot"></div><div class="tdot"></div><div class="tdot"></div>';
  c.appendChild(d); c.scrollTop = c.scrollHeight;
  document.getElementById('aiStatus').textContent = '생각 중...';
}
function hideTyping() {
  document.getElementById('typingEl')?.remove();
  document.getElementById('aiStatus').textContent = '질문하면 도와줄게!';
}
function setBusy(state) {
  busy = state;
  (TYPES[selectedType]?.sections || []).forEach(sec => {
    const b = document.getElementById('askbtn-' + sec.id);
    if (b) b.disabled = state;
  });
  document.getElementById('sendBtn').disabled = state;
}

const QUICK_QS = ['어떻게 시작해?','내 글 어때?','예시 들어줘','너무 짧은 것 같아','이 문장 어색해?','비유를 어떻게 써?','다음 칸 넘어가도 돼?','더 길게 쓰려면?'];

function buildQuickQs() {
  const wrap = document.getElementById('quickQs');
  QUICK_QS.forEach(q => {
    const chip = document.createElement('button');
    chip.className = 'q-chip'; chip.textContent = q;
    chip.addEventListener('click', () => {
      if (busy) return;
      document.getElementById('userInput').value = q;
      sendMsg();
    });
    wrap.appendChild(chip);
  });
}

// AI 연결: Vercel 서버(api/chat.js)를 통해 Claude를 불러요
sample = async (prompt) => {
  const r = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ prompt })
  });
  if (r.status === 429) { const e = new Error('rate_limited'); e.code = 'rate_limited'; throw e; }
  if (!r.ok) throw new Error('api_error');
  return r.json();
};

function init() {
  buildTypeGrid(); buildQuickQs();
  const startBtn = document.getElementById('startBtn');
  document.getElementById('topicInput').addEventListener('input', updateStartBtn);
  document.getElementById('topicInput').addEventListener('keydown', e => { if (e.key === 'Enter' && !startBtn.disabled) startApp(); });
  startBtn.addEventListener('click', startApp);
  document.getElementById('userInput').addEventListener('keydown', e => { if (e.key === 'Enter' && !busy) sendMsg(); });
}

init();
</script>
